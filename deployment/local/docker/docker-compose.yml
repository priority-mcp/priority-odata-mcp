name: priority-odata-mcp

services:
  priority-odata-mcp:
    # Published by .github/workflows/publish.yml on every push to main.
    # No build: section, so a local `docker compose up --build` cannot shadow the registry image.
    image: ghcr.io/priority-mcp/priority-odata-mcp:latest
    container_name: priority-odata-mcp
    ports:
      - "3000:3000"
    env_file:
      # Root .env supplies PRIORITY_* / ODATA_MCP_TOKEN / etc.
      # Do not re-declare those under environment with ${VAR:-default}:
      # Compose interpolates from the compose-dir/.env / shell, which would
      # override env_file and wipe values like PRIORITY_AUTH_TYPE=pat.
      - ../../../.env
    environment:
      # Container-only bind; everything else comes from env_file.
      - HTTP_HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Distroless runtime has no shell; call the image entrypoint (node) directly.
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
